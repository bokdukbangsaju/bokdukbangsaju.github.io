                    { a: '甲', b: '壬', c: '횡당유영(橫塘柳影)', d: '넓은 연못에 수양버드나무 그림자가 드리운 형상', e: '사주에 발달한 오행이 많고 합충이 적당하면 연못가에 버드나무 그림자가 드리운 듯 멋진 형상으로 연예, 예술, 문학 분야의 재능이 뛰어나다.' },
                    { a: '甲', b: '癸', c: '수근로수(樹根露水)', d: '나무들이 가랑비를 맞아 생기는 형상', e: '사주에 발달한 오행이 많고 합충이 적당하면 크게 나서지도 않고 크게 움츠려들지도 않으며 적당한 거리를 두며 사람들과의 관계를 유지해 나가는 타입이다.' },

                    { a: '乙', b: '己', c: '지란정원(芝蘭庭園)', d: '정원이 핀 난꽃, 화분에 심은 꽃나무나 정원이 심은 꽃나무의 형상', e: '안정적이고 편안한 삶을 추구하며, 꾸준한 삶을 이끌어 가면 좋은 사주이다. 욕심을 부리지 않고 계획적인 직업을 가지면 능력을 인정받을 수 있다.' },
                    { a: '乙', b: '庚', c: '금파화초(金破花草)', d: '금(金)이 화초를 자르는 형상 또는 호랑이가 미쳐 날뀌는 형상', e: '사주웨 고립된 오행이 많고 합충이 많으면 갑작스러운 사건사고나 변화변동이 따르는 유형으로, 지지에 금(金)이 많으면 건강문제를 조심해야 하고, 지지에 목(木)이 많거나 수(水)가 많으면 인덕이 많은 사람이다.' },
                    { a: '乙', b: '辛', c: '화초전지(花草剪枝)', d: '날카로운 가위로 화초를 자르는 형상', e: '안정적이고 꾸준하면서도 자신이 하고자 하는 일을 완수하고 싶은 욕망이 강하다. 계획적이고 구조환된 일을 하면 크게 성공할 수 있을 것이다.' },
                    { a: '乙', b: '壬', c: '연화호수(蓮花湖水)', d: '물 위에 떠 있는 연꽃의 형상', e: '외로이 피어 있는 난초 위에 굵은 빗줄기가 쏟아져 내리는 형상이므로 본인의 크기에 비해 받는 것이 많아 주위 사람의 인덕이 있고 사람들에게 사랑받는다. 본인이 노력하면 어느 순간 갑작스런 신분 상승이 따르거나 상류사회에 진입하는 유형이다.' },
                    { a: '乙', b: '癸', c: '지란재로(芝蘭再露)', d: '푸른 풀이 아침 이슬을 머금고 있는 형상', e: '난초 위에 이슬이 내리는 형상으로 조용한 느낌 또는 외로운 느낌을 준다. 직업으로 혼자서 하는 연구직이나 일대일로 만나는 상담 등이 어울린다. 다만, 주변에 목(木)의 나무가 많거나 태양이 떠 있어 난초나 나무가 쑥쓱 자랄수 있다면 활발하고 적극적인 물상으로서 대인관계가 무난하며, 주위 사람들의 도움이 크고 그들의 도움으로 꾸주누히 성장하는 유형이다. 이 경우 예술, 연예, 방송 분야의 끼나 연구, 개발 분야의 끼가 뛰어나므로 잘 발달시켜 나가면 크게 인정받을 수 있을 것이다.' },
                    { a: '乙', b: '乙 삼존or 사존', c: ' 난초군락(蘭草群落)', d: '난초가 집단을 이루고 있는 형상', e: '을목(乙木)은 난, 진달래, 채소와 같은 작은 나무나 풀이나 채소를 상징한다. 따라서 을목이 여러 집단을 이루면 뿌리와 서로 붙어서 수북하게 차지하고 있는 형상이므로 매우 긍정적이고 희망적이다.이런 물상은 겉모습이 많이 비바람의 형상이 되거나 바위나 사막의 형상이 되어도 바위산의 난이나 활짝 피는 비바람 속 사막의 선인장처럼 충분히 살아남을 수 있다. 다음으로는 **수(水)**가 충분하면 수변으로 화초나 채소를 생산할 수 있으니 좋고, 흙의 화초와 정원이 되어 화초와 같은 식물을 잘 성장시킬 수 있다.' }
                ]
            },
            {
                id: 'byeong', name: '병 (丙)',
                items: [
                    { a: '丙', b: '甲', c: '비조부혈(飛鳥趺穴)/거목조양(巨木照陽)', d: '나는 새가 새끼 둥지를 찾는 형상 또는 큰 나무에 태양이 비추는 형상', e: '감각과 감수성이 발달하고 센스가 있다. 적극적인 표현으로 주위 사람들에게 다가서고, 역마살과 예술적 끼가 있어서 일찍 고향을 떠나거나 부모에게서 독립하여 자신의 끼를 발휘한다.' },
                    { a: '丙', b: '乙', c: '염양려화(艶陽麗花)', d: '아름다운 꽃이 찬란한 햇살을 받아 화려하게 빛나는 형상', e: '찬란한 태양빛이 꽃을 비추듯 화려한 형상으로 감수성이 발달되어 있고, 타인이 우러러보고 인덕이 있다.' },
                    { a: '丙', b: '丙', c: '태양병존(太陽竝存)/복음홍광(伏吟洪光)', d: '세상에 2개의 태양이 떠 있어 뜨거운 열기가 가득하고 햇살이 뜨거운 형상', e: '한 하늘에 2개의 태양이 비추면 온 세상이 뜨겁듯이, 열정이 넘치고 자신감이 강하며 자신의 생각이나 감정을 감추지 않고 표현하며 활동적이고 적극적인 타입이다. 또한 하늘에 2개의 태양이 있어서 많은 사람들이 잘 볼 수 있는 물상으로 사람들에게 인기 있는 연예, 예술, 방송, 문학 등의 직업에 잘 어울린다.' },
                    { a: '丙', b: '丁', c: '일월재회(日月再會)', d: '태양과 달이 만나거나, 삼기(三奇) 을병정(乙丙丁)이 따르는 형상', e: '	온 세상에 태양과 달이 환하게 비추거나 꽃들이 가득한 형상으로, 화려함을 추구하거나 자신의 감정을 시원스럽게 표현하는 타입이다. 밝은 빛을 활용할 토(土)나 나무의 목(木)이 있으면 좋고, 화(火)로 제련하고 물로 씻어 보석을 만드는 금(金)과 수水)가 있어도 좋다.' },
                    { a: '丙', b: '戊', c: '대야양영(大野陽映)', d: '넓은 들판에 태양이 비추는 형상', e: '넓은 들판에 햇살이 두루 비추는 형상이므로 천간에 비 내리는 임수(壬水)나, 지지에 시냇물이나 감울에 해당하는 수(水)가 있으면 매우 좋은 물상이다. 더불어 갑을인묘(甲乙寅卯)의 곡식이나 나무들이 적당히 간지에 뿌리를 내리고 있으면 최고의 사주라고 할 수 있다. 해외에 자주 왕래하고, 표현력이 필요한 직업에 어울리는 사람이다.' },
                    { a: '丙', b: '己', c: '정원보조(庭園普照)', d: '정원에 햇살이 두루 비추는 형상', e: '작은 정원에 햇살이 따뜻하게 내리쬐므로 사주에 을묘(乙卯)의 곡식이나 꽃나무가 있으면 가장 좋고, 무(戊)나 기(己)나 축미(丑未)의 토(土)가 있으면 갑인(甲寅) 과실나무나 큰 정원수도 필요하다. 이들이 있으면 최상의 사주가 될 것이다. 더불어 임자계해(壬子癸亥)의 수(水)가 적당히 있으면 이 또한 사주를 돋보이게 할 것이다.' },
                    { a: '丙', b: '庚', c: '금철화소(金鐵火燒)/석산화영(石山火映)', d: '커다란 쇠막대기나 광석을 큰 불로 녹이는 형상 또는 커다란 바위산에 햇살이 비추는 형상', e: '커다란 광물을 큰 불로 제련하는 형상이므로 병화(丙火)와 경금(庚金)을 모두 조절할 수 있는 임자(壬子)가 가장 좋고, 계해(癸亥)도 좋으며, 다음으로 지지의 수국(水局)도 좋다. 더불어 땔감인 목(木)과 화력이 더 센 화(火)와 금(金)이 동시에 있으면 더할 나위 없이 좋으며, 이것을 모두 갖추고 있으면 최상의 사주라고 할 수 있다. 독재욕과 자제력이 동시에 있으며, 자신을 관리하면서 맡겨진 일들을 추진하는 리더십이 뛰어나다. 간혹 급한 기질이 단점이다.' },
                    { a: '丙', b: '辛', c: '조옥화훼(珠玉火毁)', d: '크고 뜨거운 불이 보석이나 작은 금속을 녹이는 형상', e: '보석이나 작은 쇠붇이들이 커다란 용광로불에 녹아 쇳물이 되어 있는 상태이므로 가장 먼저 금속을 보강해주는 것이 우선이다. 따라서 사주에 신(辛)이나 유(酉)의 금(金)이 있으면 쇳물로 더 큰 보석을 만들 수 있을 것이다. 두번째는 토(土)가 필요하나데 쇳물을 막아줄 수 있어 좋다.' },
                    { a: '丙', b: '壬', c: '강휘상영(江暉相瑛)', d: '강가에 태양이 비추는 형상', e: '강에 태양이 비추고 있으므로 강가에 버드나무가 하늘하늘 늘어지면 매우 아름다울 것이다. 그러므로 갑(甲)이나 인(寅)처럼 목(木)의 큰 나무가 있으면 좋고, 을(乙)이나 묘(卯)의 작은 화초들은 군락으로 여러 그루 있으면 좋을 것이다. 더불어 신금(辛金)이나 유금(酉金)의 보석이 강에 있으면 강물로 인해 빛날 것이다.' },
                    { a: '丙', b: '癸', c: '일광흑운(日光黑雲)', d: '밝은 태양에 검은 구름이 머무는 형상', e: '밝은 태양이 비추는데 제대로 비를 내리지 못하고 검은 구름만 몇 조각 떠 다니는 형상이다. 따라서 임(壬)이나 자(子)나 해(亥)가 있어서 임계(壬癸)의 빗줄기나 해자(亥子)의 시냇물이나 강물을 만들 수 있으면 최고의 물상이 될 것이다. 수(水) 다음으로는 갑인을묘(甲寅乙卯)의 나무를 심거나, 무기진축술미(戊己辰丑戌未) 토(土)로 물을 가둘 수 있으면 좋다. 많은 사람들에게 인기를 얻을 수 있고 시선을 집중적으로 받을 수 있다. 예술, 연예, 방송의 끼도 강한 타입이다.' },
                    { a: '丙', b: '丙 삼존or 사존', c: '태양조공(太陽照空)', d: '태양이 높이 떠 있고 세상이 뜨거운 형상', e: '태양이 하늘에 3~4개가 있는 것처럼 밝게 빛나고, 뜨거운 열기가 가득한 형상이다. 지지나 물이 있어서 바다나 강이 되면 커다란 호수나 바다에 태양이 떠 있는 형상이므로 멋진 경치가 되고, 바다나 호수에 물고기나 미생물 또한 풍족할 것이다. 퇴도가 많아 넓은 들판이 있으면 이 또한 논밭으로 사용하여 수확이 많을 것이다. **금(金)**은 바위산 또는 광석, 광산, 쇳덩어리이므로 뜨거운 화(火)를 제련하여 훌륭한 비행기나 선박 같은 것을 만들 수 있다. 그러나 나무인 **목(木)**은 화(火)의 불길이 되어 뿌리와 모두 타고 불이 너무 뜨거워지므로 불리하다.' }
                ]
            },
            {
                id: 'jeong', name: '정 (丁)',
                items: [
                    { a: '丁', b: '甲', c: '유신유화(有薪有火)/유신유화(有薪有華)', d: '큰 나무에 꽃이 피어 있는 형상 또는 마른 나무에 성냥불을 붙이는 형상', e: '나무에 꽃이 핀 형상이므로 비가 오면 꽃이 떨어져 열매를 맺지 못하게 된다. 그러므로, 천간에 임수(壬水)가 있으면 불리하지만, 지지에 해수(亥水)나 자수(子水)가 필요하다. 더불어 나무가 잘 자랄 수 있는 무기토(戊己土)나 진술축미토(辰戌丑未土) 역시 필요하다.' },
                    { a: '丁', b: '乙', c: '화초개화(花草介花)', d: '화초에 꽃이 피어 있는 형상', e: '화초에 꽃이 피어 있으므로 식물을 키우기 적당한 영양분이 있는 기토(己土) 또는 진술축미토(辰戌丑未土)가 필요하다. 더불어 적당한 물이 임자계해수(壬子癸亥水)가 조금 필요하다. 이렇게 갖추어진 사주는 인덕도 있고 부모복도 있고 재물복도 있다.' },
                    { a: '丁', b: '丙', c: '화화분분(火火奔奔)/화염분분(火炎奔奔)', d: '크고 작은 꽃들이 만발한 형상 또는 화염이 솟구치는 형상 또는 뜨거운 한여름 같은 햇살의 형상', e: '천간에 화(火)의 꽃이나 태양이나 달, 또는 지지에 적당한 화(火)의 열기나 꽃이 피어 있으면 인덕이 매우 좋고, 예술적 감각이나표현력이 뛰어나다. 수(水)가 적당하게 있거나 축축한 습기를 가진 토(土)가 있으면 꽃이 잘 핀다. 다만, 수(水)가 많으면 여자는 조울증이 생길 수 있어 감정 기복이 매우 심하다.' },
                    { a: '丁', b: '丁', c: '양화위염(兩火爲炎)·소화개병(小花介瓶)', d: '2개의 불이 타오르는 형상, 2개의 별이 떠 있는 물상, 2개의 작은 꽃이 꽃병에 피어 있는 형상', e: '2개의 달이나 별이 하늘에서 빛나는 형상 또는 꽃이 피어 있는 형상이다. 3개 이상 있어야 하는데 2개는 외롭기 때문에 목(木)이 발달하여 나무가 무성해야 한다. 또는 천간이나 지지에 또 다른 화(火)가 고립 없이 1~2개 있으면 금상첨화로 인덕이 많고부모복도 크다.' },
                    { a: '丁', b: '戊', c: '유화유로(有火有爐)·광야유화(廣野有火)', d: '화로 속의 불 또는 넓은 들판의 불빛 형상', e: '넓은 들판에 홀로 피어 있는 꽃 또는 넓은 들판 위에 떠 있는 달이나 별의 모습이므로 다소 인덕이 부족하고 외로운 타입이다. 다른 간지에 화(火)가 있어 사주 전체로 보아 발달이면 넓은 들판의 화려한 꽃무리이므로 인덕도 좋고, 하고자 하는 일에서 큰 능력을 발휘한다.' },
                    { a: '丁', b: '己', c: '성타구진(星墮句陳)·정원유화(庭園有火)', d: '구진은 별자리의 하나이므로 별이 땅에 떨어진 형 상 또는 정원의 햇살, 달빛, 불빛의 형상', e: '작은 정원에 피어 있는 한 송이 꽃의 형상이므로 이 상태로는 외로움이 가득하다. 인덕이 부 족하고 늘 허전한 마음뿐이다. 사주 내에 또 다른 화(火)가 발달되어 있고 토(土)도 발달되어 있으면 의식주도 충족하고 재 물도 크게 들어오며 인덕이 있다. 부동산으로 잘 묶어두면 큰 재물을 얻고 행복을 느낄 것이다.' },
                    { a: '丁', b: '庚', c: '화련진금(火鍊眞金)·화련광석(火鍊廣石)', d: '불로 제련하여 보석을 만드는 형상 또는 광석을 불로 제련하는 형상', e: '금(金)이 발달되어 있으면 광석이나 광산을 발견한 형상이므로 재물이 따라온다. 제대로 제련하여 보석으로 만들 수 있는 화(火)가 1~2개만 더 있으면 최고로 가치 있는 사주가 될 수 있다. 발달한 목(木)이 적당히 있으면 나무가 화(火)의 땔감이 되므로 언제나 먹을 복과 부동산 복이나 윗사람의 인덕이 있다.' },
                    { a: '丁', b: '辛', c: '소훼주옥(燒毀珠玉)·화련주옥(火鍊珠玉)', d: '등보석을 불로 녹이는 형상 또는 보석을 불로 세공 하는 형상', e: '예쁜 꽃 또는 달빛이나 별빛에 해당하는 정화(丁火)와 보석에 해당하는 신금(辛金)이 있으므로 미남미녀가 많은 사주다. 여기에 임수(壬水)나 계수(癸水)가 있어서 신금(辛金) 보석을 물로 씻어내면 보석이 더욱 빛나므로 인기, 연예, 예술, 문학에서 큰 능력을 발휘할 수 있다.' },
                    { a: '丁', b: '壬', c: '성기득사(星奇得使)/호수화조(胡水火照)', d: '달이 물을 비추는 형상', e: '호수 위에 떠 있는 달빛이나 별빛, 또는 호수 위에 떠 있는 작은 꽃의 물상이다. 사람 시선이 머무는 연예, 예술, 방송, 문학 분야에서 끼를 발휘하는 직업이 좋다. 외롭고 인덕이 부족하므로 병(丙)의 태양 또는 정(丁)의 달이나 별이 1~2개 더 있으면 좋다. 임자계해(壬子癸亥)의 수(水)가 있으면 큰 강물처럼 시원하게 밀고 나가는 추진력이 있다.' },
                    { a: '丁', b: '癸', c: '주작투강(朱雀投江)·성영투운(星影投雲)', d: '주작이 강에 뛰어든 형상 또는 별빛이 구름에 가려진 형상', e: '작은 샘물에 떠 있는 달빛이나 별빛 또는 연꽃 한 송이의 모습으로 예쁘지만 외로움이 가득 하다. 곁에 사람들이 많이 있어도 인덕이 부족하고 외로운 형상이다. 사주에 화(火)와 수(水)가 더 있어 물과 햇살을 가지면 인덕과 재물복과 명예운이 따른다. 목(木)의 나무가 있으면 부동산복이 넘쳐난다.' },
                    { a: '丁', b: '丁 삼존or 사존', c: '성전별휘(星殿別輝)', d: '별들이 반짝이고 달이 빛나는 형상', e: '밤하늘의 별이나 또는 작은 불이 여러 개 모여 있는 형상이다. 금을 제련하는 불로 또는 세상을 밝혀주는 등불로, 지지에 **금(金)**이 있으면 **정화(丁火)**로 충분히 제련하여 비행기, 선박, 컴퓨터, 보석 등을 만들 수 있고, **수(水)**가 많아 바다의 집 또는 호수를 이루면 호수에 달빛을 비추어 아름다운 경치를 만들어낸다.**토(土)**가 있어 넓은 들판이나 논밭이 있으면 곡식들과 나무들을 잘 자랄 수 있는 영양분이 충분하고, **목(木)**이 있으면 나무의 성장을 도와줄 수 있다. 	그러나 **화(火)**가 있으면 큰 세상이 불이 붙어서 불리하다.' }
                ]
            },
            {
                id: 'mu', name: '무 (戊)',
                items: [
                    { a: '戊', b: '甲', c: '석압목(巨石壓木)·광야고목(廣野孤木)', d: '큰 돌로 나무를 누르는 형상 또는 넓은 들에 홀로 서 있는 나무의 형상', e: '넓은 들판에 우뚝 솟은 미루나무의 기상처럼 자신감 있고 적극적이다. 들판이 좀더 넓은 토(土)가 있거나, 나무나 화초 등이 들판에 있으면 부동산복이나 재물복이 좋으며, 자신이 하자 하는 일에 반드시 결과가 있으므로 명예도 원하는 만큼 얻는다. 단시간에 이루려 하지고 크고 길게 목표를 잡고 밀고 나가는 것이 좋다.' },
                    { a: '戊', b: '乙', c: '청룡합령(靑龍合靈)·광야독란(廣野獨蘭)', d: '청룡이 신령스럽게 짝을 짓는 형상 또는 넓은 들 판에 홀로 핀 난초의 형상', e: '넓은 들판에 홀로 있는 한 그루 작은 나무의 형상인데 이 자체로는 인덕이 부족하다. 여기어 갑인을묘(甲寅乙卯)의 목(木)이 발달하면 인덕이 있고, 사람을 너그럽게 감싸주는 여유로움 배짱이 있다. 또한 무기진술축미(戊己辰戌丑未)의 토(土)가 발달 이상이면 부동산복이 커서 부동산 투 에서 능력을 발휘할 수 있다.' },
                    { a: '戊', b: '丙', c: '일출동산(日出東山)·일출광야(日出廣野)', d: '동산이나 넓은 들판에 태양이 떠오르는 형상', e: '넓은 들판에 태양이 떠 있는 형상이므로 성격이 매우 밝고 명랑하다. 다만, 사주에 목(木)이나 금(金)이 있어서 나무를 자라게 하거나 금은광석을 캐낼 수 있어야 재물이나 리더십을 발휘할 수 있다. 수(水)가 있어서 논밭을 기름지게 하면 나무가 자랄 수 있는 것처럼 누군가의 참모가 될 수 있다.' },
                    { a: '戊', b: '丁', c: '광야요명(廣野耀明)·유화유호(有火有虎)', d: '넓은 들판을 비추는 빛이나 화롯불의 형상', e: '넓은 들판에 달빛이나 별빛이 외로이 떠 있는 형상 또는 넓은 들판에 외로이 피어 있는 형상이므로 인덕이 부족하고, 늘 허전함이 가득할 수 있다. 사주에 화(火)가 더 있어서 발달의 형태면 인덕이 있고, 토(土)가 발달되어 있으면 어떤 곡식이나 어떤 물이나 어떤 광석이나 모두 쓰임이 있듯이 사람도 타인을 감싸주고 여우 리더십이 있어서 다른 사람이 따르게 된다.' },
                    { a: '戊', b: '戊', c: '복음준산(伏吟峻山)·대야광전(大野廣田)', d: '첩첩이 쌓인 흙산의 형상 또는 크고 넓은 들판과 논밭의 형상', e: '넓은 들판이 펼쳐진 형상 또는 커다란 흙산이 겹쳐 있는 형상이므로 넓은 땅을 돌아다니는 역마살의 기운과 부동산복이 있다. 일단 넓은 땅이 있으므로 나무를 심을 수도 있고, 물을 가 둘 수도 있고, 광석을 품을 수도 있고, 뜨거운 태양빛을 받을 여유도 있다. 그러므로 포용력이 있고 여유로운 성격의 소유자라고 할 수 있다. 이런 물상은 어떤 오행이든 혼자 고립되지 않고 발달의 형태로 2~3개가 함께 붙어 있으면 좋다. 목(木)이 발달하면 충분한 수확을 얻고, 금(金)이 발달하면 충분한 광석을 얻으며, 화(火) 가 발달하면 땅의 미생물을 발효시켜 땅을 기름지게 하고, 수(水)가 발달하면 땅이 메마르지 않게 해준다.' },
                    { a: '戊', b: '己', c: '물이유취(物以類聚)', d: '비슷한 것들이 모여 있는 형상, 즉 넓은 땅이나 좁은 땅들이 어울려 모여 있는 형상', e: '무무(戊戌) 병존에 비해 역마살의 기운은 작지만, 넓은 논밭과 작은 정원을 가지고 있으므로 어느 정도 부동산복이 있다. 무엇보다 사주 내에 고립 없이 토(土)가 1~2개 더 있으면 부동산복이 넘치고, 포용력과 여유로운 성격의 소유자라고 할 수 있다. 다음으로, 땅이 기름지려면 나무나 풀이 있어야 한 나무나 풀 같은 식물이 있으면 가을에 낙엽이 지고 풀이 죽어서 땅의 거름이 되기 때문이다. 나무가 성장하듯이 성공과 명예를 얻을 수 있고, 땅을 기름지게 하는 것과 같이 사람을 지름지게 하는 교육자, 의사, 법조인, 사회사업가가 어울린다. 다음으로 물이 필요하고, 그다음으로 화(火)가 필요하다.' },
                    { a: '戊', b: '庚', c: '조주위학(助紂為虐)·토산석산(土山石山)', d: '나쁜 사람을 도와 나쁜 짓을 저지르는 상황(참견이 극심하여 손해를 보는 상황) 또는 흙산과 바위산이 나란히 있는 형상', e: '흙산과 바위산이 겹쳐 있는 형상 또는 넓은 들판과 바위산이 있는 형상으로 대단히 넓은 공 간이다. 그러므로 역마살의 기운이 강하여 활동을 많이 하고, 움직임이 큰 직업이 좋다. 먼저 넓은 땅과 광석 둘 다 만족시키는 것은 물인 수(水)이다. 비나 강물이 땅을 메마르지 않게 해주고 광석을 더욱 빛나게 해주기 때문이다. 이런 사주는 인기를 얻거나 사람들에게 공헌할 수 있는 일이 어울린다. 다음으로는 화(火) 이다. 태양이나 불이 땅의 미생물을 번식시키고 광석을 제련시킬 수 있기 때문이다. 누군가를 만들고 키우고 부리는 일을 하기 때문에 교육자, 정치인, 사업가의 기질이 있다고 본다.' },
                    { a: '戊', b: '辛', c: '전답주옥(田沓珠玉)', d: '논과 밭에서 발견한 금은보석의 형상', e: '흙산 또는 넓은 들판에 보석이 있는 형상이므로 보석을 찾기가 매우 힘들다. 이 자체로는 고되고 힘들고 인덕이 부족하다. 이런 물상은 보석이나 광석이 2개 이상 있어 금(金)이 발달되어 있으면 광산으로 개발할 수 있다. 다만, 광산이 있어도 화(火)로 제련하고 물인 수(水)로 씻어내지 않으면 보석이 될 수 없듯 이, 금(金) 자체만 발달하여 원석으로 존재하면 다듬기 이전이므로 계획하고 아이디어를 생각 해내는 상태, 즉 일을 실행하는 데 도움을 주는 참모격이라고 할 수 있다. 따라서 이런 사주는 상담가, 카운슬러, 교육자가 잘 어울린다. 여기에 화(火)로 제련하고 수(水)로 씻어내면 자신이 실행하고 돌파하는 사업가, 정치가, 전문가가 어울린다.' },
                    { a: '戊', b: '壬', c: '산명수수(山明水秀)', d: '아름다운 들판을 가로지르는 큰 강물의 형상 또는 흙산 계곡에서 흘러 나오는 큰 계곡물의 형상', e: '넓은 들판의 강물이므로 포용력이 크고, 힘차게 흐르는 강물처럼 막힘 없이 밀고 나가며, 자연에 물을 주듯이 사람들의 관계를 부드럽게 조율한다. 논밭이 넓으면 충분한 곡식을 얻듯이 재물을 얻고, 강물인 수(水)가 발달하면 땅이 풍요로워지듯이 부동산이 넓어진다.' },
                    { a: '戊', b: '癸', c: '암석침식(岩石侵蝕)·절벽낙로(絕碧落露)', d: '암석이 서서히 침식되는 형상 또는 절벽이나 넓은 들판에 내리는 이슬의 형상', e: '넓은 들판에 아침 이슬이 내리는 형상이다. 아침에 안개나 이슬이 내리면 그 날은 하루 종일 화창하게 햇살이 대지를 비춘다. 그러므로 무계(戊癸) 병존은 시간이 지나면서 화(火)의 기운이 점차 강해진다고 본다. 열성 적이고 적극적인 성향이 많아지고, 사주가 조열해서 무언가를 확장하고 싶어진다. 임수(壬水)나 자수(子水)가 사주 내에 발달되어 있으면 재물도 풍족하고 삶이 윤택해질 것이다.' },
                    { a: '戊', b: '戊 삼존or 사존', c: '광야총진(廣野叢辰)', d: '끝없이 펼쳐진 들판과 논밭의 형상', e: '끝없이 펼쳐진 평야, 넓고 넓은 논밭이나 들판의 모습이다. 넓은 들판에 나무 목(木)을 심으면 결실을 맺을 수 있으므로 사업가, 경영인, 정치인, 전문가, 공무원 등의 직업이 어울린다. 넓은 들판에 물인 수(水)를 가두면 호수가 되어 유유자적하며 구경할 수 있으므로 연예, 예술, 방송 분야의 직업이 어울린다. 또한 넓은 들판에 광물인 금(金)이 매장되어 있으면 캐내서 제련하고 씻어내야 하므로 꾸준히 하는 직업, 평생 변화 없이 가는 직업인 직업군인, 교육자, 공무원, 회사원 등이 어울린다. 그리고 햇살의 화(火)가 있으면 토(土)의 영양분이 생기므로 참모 역할이 어울린다.' }
                ]
            },
            {
                id: 'gi', name: '기 (己)',
                items: [
                    { a: '己', b: '甲', c: '목강토산(木强土山)·거목소정(巨木小庭)', d: '작은 언덕이나 정원에 있는 큰 나무의 형상', e: '작은 정원에 큰 나무가 서 있는 형상이므로 자칫하면 나무가 영양분이 부족해 죽어버릴 수 있다. 다만, 수(水)가 있거나 나무가 썩어버리면 정원은 매우 비옥할 가능성이 높다. 인덕이 많고, 나무가 쭉쭉 뻗어가는 형상으로 명예나 관직복이 따른다. ' },
                    { a: '己', b: '乙', c: '야초난생(野草亂生)·정원고난(庭園孤蘭)', d: '들꽃이 흩어져 피어 있는 형상 또는 정원에 홀로 핀 난초꽃의 형상', e: '정원에 자라는 작은 나무 한 그루의 형상이므로 안정적이고 편안한 삶을 살 수는 있다. 다만, 외로움을 느끼게 되고, 화려함이 없고 인덕도 부족하다. 이 경우 사주에 기토(己土)보다는 무토(戊土)나 진술축미토(辰戌丑未土)가 2개 이상 있으면 인덕도 있고 포용력도 있다. 목(木)이 2개 이상 있으면 어떤 것이든 결실을 맺게 되고, 수(水)가 3개 이상 있으면 자연에 게 가장 필요한 수분을 얻게 되므로 살아가는 데 가장 필요한 재물이 풍족해진다.' },
                    { a: '己', b: '丙', c: '대지보조(大地普照) - 정원조일(庭園照日)', d: '대지가 빛나는 형상 또는 태양이 정원을 비추는 형상', e: '태양이 정원을 비추는 형상이므로 정원의 흙이 메마를 가능성이 높다. 태양의 기운을 모두 받을 수 있는 넓은 토(土)가 있으면 좋고, 그 다음으로는 목(木)의 나무와 물의 수(水)가 있으면 사주 구성이 뛰어날 것이다. 태양인 화가 2개 이상 있으면 사람들에게 인기가 넘쳐나고, 토(土)가 2개 이상 있으면 부동산복이 있고 포용력이 있으며, 수(水)가 2개 이상 있으면 살아가는 데 필요한 재물을 얻을 수 있다.' },
                    { a: '己', b: '丁', c: '주작입묘(朱雀入墓)·습토조양(濕土照陽)', d: '주작이 묘지에 들어간 형상 또는 토질이 습한 땅 에 햇살이 비치는 형상', e: '정원에 비치는 달빛의 형상이므로 감수성이나 정서가 발달했지만, 외로움이나 쓸쓸함이 따 를 수 있다. 인덕이 없이 외로운 달밤에 홀로 서 있는 느낌이다. 혼자 빛나는 형상이므로 재주 나 끼를 발휘하여 자신을 내세우는 직업이 좋다.' },
                    { a: '己', b: '戊', c: '소산대산(小山大山)·경연상배(硬軟相配))', d: '작은 흙산과 큰 흙산이 함께 있는 형상 또는 강함 과 부드러움이 함께 있는 형상', e: '정원과 들판의 논밭이 모두 있어 꽃과 곡식을 동시에 얻을 수 있는 형상이다. 먹을 복과 여가 활동을 할 수 있는 환경이 조성되어 있고, 부동산복도 어느 정도 있는 편이다.여기에는 나무나 꽃을 심는 것이 우선이므로 적당한 목(木)이 있으면 하는 일의 결실이나 성공이 반드시 따르게 되고, 적당한 수(水)가 있어서 땅을 메마르게 하지 않고 나무나 꽃에 수 분을 줄 수 있으면 재물도 얻고 평생 먹을 복이 있고 윤택한 삶을 산다.' },
                    { a: '己', b: '己', c: '복음연약(伏吟軟弱)·연토복음(軟土伏吟)', d: '부드러운 흙무더기가 여러 개 있는 형상 또는 부드러운 흙이 여러 개 겹쳐 있는 형상', e: '정원이 조금 넓을 운이므로 정원수나 꽃만 자라고, 사람에게 실제로 필요한 곡식이나 채소를 키우기에는 좁은 땅이다. 그러므로 좀더 넓은 토(土)가 있으면 좋고, 그 곳에 목(木)이 있으면 좋을 것이다. 기토(己土) 가 겹쳐 있는 작은 정원 형상은 포용력이 부족하지만, 자기 것을 관리하는 능력은 뛰어나므 로 다른 곳에 토(土)가 있으면 포용력도 있고 인덕도 있다. 더불어 금(金)이 있으면 땅에서 캔 원석 형태이므로 조언자 역할을 해줄 수(水)가 함께 있으면 땅에 실제로 도움이 되고 실용성이 높다.' },
                    { a: '己', b: '庚', c: '전도형격(顛倒刑格)·옥토광석(沃土廣石)', d: '하는 일이 엎어지고 뒤집어지는 형상 또는 기름진 흙 속에 있는 광석(바위산)의 형상', e: '좁은 정원에서 광석을 발견한 상황 또는 좁은 정원이 돌로 이루어져 나무나 화초 등을 심을 수 없는 형상이다. 이 경우 흙이 좀더 있으려면 토(土)가 2개 이상 필요하고, 물에 해당하는 수(水)가 있으면 좋다. 물만 있으면 바위산에서도 화초들이 살 수 있기 때문이다.' },
                    { a: '己', b: '辛', c: '습니오옥(濕泥汚玉)·옥토주목(沃土珠玉)', d: '진흙 속에 오염된 옥이 파묻힌 형상 또는 기름 흙 속에 보석이 파묻힌 현상', e: '화분에서 보석을 발견한 형상이므로 재물복이나 의식주가 풍족하다. 이 물상은 신금(辛金)이 하나뿐이지만, 사주에 2개 이상 있으면 보석이 빛나는 형상이 더욱 좋을 것이다. 더불어 화분의 흙 정도로 작은 땅이므로 좀더 기름진 흙으로 토(土)가 2개 이상 더 넓은 논밭을 가질 수 있고, 노력하면 보석도 충분히 생산할 수 있다.' },
                    { a: '己', b: '壬', c: '기토탁임(己土濁壬)·옥토탁감(沃土濁江)', d: '작은 흙이 큰 강물이나 바다에 뿌려진 형상 또는 기름진 흙이 강을 흐려놓은 형상', e: '작은 정원에 쏟아붓는 빗줄기의 모습으로 정원의 흙이 모두 떠내려가는 형상이다. 먼저 토(土)가 2~3개 이상 있어서 시원한 빗줄기를 모두 윤택하게 만들 수 있으면 재물을 얻고, 포용 력과 여유로운 리더십을 만들어갈 수 있다. 다음으로, 목(木)이 2~3개 이상 있어서 나무나 곡식이 정원에 뿌리를 내리면 그로 인해 결실이나 성공을 얻을 수 있어서 좋다. 그 다음으로는 햇살이나 온도를 맞추어주는 화(火)가 필요하다.' },
                    { a: '己', b: '癸', c: '옥토위생(沃土爲生)·옥토로우(沃土露雨)', d: '기름진 흙이 더욱 윤택해지는 형상 또는 기름진 흙에 이슬비가 내리는 형상', e: '정원에 내리는 이슬비로 정원이 늘 촉촉하게 젖어 있는 형상이다. 작은 정원에 윤택한 땅이 므로 남을 포용하는 마음이나 배짱이나 추진력은 부족하지만, 섬세하고 안정적이며 내성적 인 타입이다. 가장 우선적으로 필요한 것은 토(土)로, 토(土)가 2-3개 이상 있어야 좀더 안정감 있게 자신과 가족에게 필요한 재물을 모으고 여유를 누릴 수 있을 것이다. 토(土)가 아니라면, 금(金)의 돌산이나 바위산에 물인 수(水)가 동시에 있으면 충분히 아름다운 풍란이나 야생난이 자랄 수 있다. 이렇듯 금수(金水)가 있으면 사람들이 산에 피어 있는 꽃이나 난을 바라보듯이 사람들의 주 목을 많이 받는 예술, 연예, 방송, 교육 등의 직업이 어울린다.' },
                    { a: '己', b: '己 삼존or 사존', c: '광정윤토(廣廷潤土)', d: '넓은 정원에 기름진 흙의 형상', e: '기름져서 식물이나 화초가 잘 자랄 수 있는 정원이나 논밭의 형상이다. 윤택하고 기름진 정원이나 뒷밭에는 나무 목(木)을 먼저 심는 것이 매우 좋다. 채소와 같은 식물들이 잘 자랄 수 있어 수확이 넘치고, 경영, 정치, 사업 등의 분야에 어울린다. 또한 화(火)의 꽃을 심어 관상용으로 키울 수도 있으므로 연예, 예술, 방송 분야도 어울린다.' }
                ]
            },
            {
                id: 'gyeong', name: '경 (庚)',
                items: [
                    { a: '庚', b: '甲', c: '흔목위재(欣木爲才)·벽갑지상(劈甲之相)', d: '나무를 쪼개어 재목을 만드는 형상 또는 나무를 쪼개는 형상', e: '도끼로 큰 나무를 쪼개는 형상 또는 도끼로 큰 나무를 가지치기 하는 형상이다. 이 물상은 목 (木)의 땔감이 충분하면 좋으므로 목(木)이 2~3개 이상 있으면 좋다. 다음으로, 화(火)가 있어서 목(木)을 태우면 좋다. 가지치기 형태라면, 목(木)이 2~3개 있는 상태에서 수(水)가 있어서 목(木)을 성장시키면 좋다. 목(木)을 불의 땔감으로 삼으면 열정적이고 행동적인 성격이고, 목(木)을 물로 도와주면 꾸 준한 성장과 조용한 성격으로 자신의 삶을 이끌어간다.' },
                    { a: '庚', b: '乙', c: '석산합화(石山合花)·상합유정(相合有情)', d: '커다란 바위산에 난초꽃이 피어 있는 형상 또는 난초꽃이 바위산에 붙어 피어 정이 있는 형상', e: '커다란 바위산 위에 석란이 고고하게 피어 있거나 말라버리는 형상이므로 잘하면 세상에 이 름을 날리겠지만, 잘못하면 육체적정신적으로 어려운 일을 겪는 것을 의미한다. 재물을 탐 하는 사업보다는 연구, 체육, 운동, 법조, 교육 등의 직업에 적성이 있다. 홀로 우뚝 서 있는 바위산에 을목(乙木)인 난 한 그루가 있으므로 자존감이 강하고 자신을 내세우는 직업이나 연예, 예술, 방송 분야도 어울린다.' },
                    { a: '庚', b: '丙', c: '거산태양(巨山太陽) · 태백입형(太白入熒)', d: '거대한 바위산에 빛나는 태양의 형상 또는 태백성 (太白星)이 형성(熒星, 화성)에 들어간 형상', e: '바위산에 태양이 비치는 형상 또는 큰 광석을 용광로에서 제련하는 형상이다. 먼저 충분히 제련할 수 있도록 2~3개의 적당한 금(金), 특히 경금(庚金)이나 신유금(申酉金)이 있으면 좋다. 다음으로는 화(火)가 충분히 있어서 금(金)을 제련한 후, 수(水)로 제련된 금속을 씻어주 불기운을 식혀주면 최상의 물상이다. 이 세 가지를 갖추면 최고의 다이아몬드, 최고의 보석을 얻는 물상이므로 재물도 많고 기도 많고, 명예도 크게 얻을 수 있다.' },
                    { a: '庚', b: '丁', c: '특화이예(得火而銳)·화련진금(火煉眞金)', d: '불을 얻어 예리하게 변하는 형상 또는 불로 제련 하여 보석을 만드는 형상', e: '커다란 광석을 작은 불로 제련하는 형상이므로 화(火) 기운이 너무 약하다. 먼저 화(火)의 약 한 기운을 강하게 보강해야 하므로 화(火)가 2-3개 이상 더 있어야 한다. 다음으로, 금(金)이 있으면 좋다. 또는 바위산을 비추는 달빛의 형태이므로 먼저 수(水)가 필요하고, 그 다음에 목(木)의 소나 무나 풍란이나 철쭉을 바위산에 심는 것이 좋다. 금(金)을 녹이면 적극적으로 생산하거나 통솔하는 형태로 사장, 정치인, 경영인, 전문가가 적성에 맞고, 수(水)가 있은 후 나무를 심는 형상이면 바위산의 고고한 소나무나 풍란처럼 연 예, 예술, 문학, 방송, 교육자로 능력을 발휘하는 것이 좋다.' },
                    { a: '庚', b: '戊', c: '토석중산(土石重山)·석산토야(石山土野)', d: '흙산과 돌산이 겹쳐 있는 형상 또는 바위산과 넓은 들판의 형상', e: '커다란 바위산 또는 넓은 바위 사막과 넓은 들판을 상징한다. 이렇게 사주에 경무(庚戊) 병 이 있으면 역마살의 기운이 매우 강하다. 해외의 넓은 땅을 왕래할 정도가 되려면 무토(戊土)나 경금(庚金)이나 술토(戊土)가 하니 상 더 있으면 좋고, 역마살에 해당하는 인신사해(寅申巳亥)가 있어도 좋다. 커다란 광석 또는 바위산을 화(火)로 제련하여 수(水)로 씻어내어 보석을 만드는 방법이 있고고, 수(水)의 물이 있은 다음에 나무가 여러 그루 집단으로 있어도 매우 좋은 물상이다.' },
                    { a: '庚', b: '己', c: '금실무성(金實無聲)·석산소토(石山小土)', d: '금(金)이 꽉 차서 소리가 나지 않는 형상 또는 돌산 위에 있는 작은 흙의 형상', e: '커다란 바위산에 흙이 덮인 형상이므로 나무를 심으려면 수(水)와 토(土)가 더 필요하다. 그러 므로 수(水)와 토(土)가 어느 정도 갖추어진 다음에 목(木)이 있는 것이 좋다. 한편 나무를 심지 않고 금속을 보석으로 제련하려면 화(火)와 수(水)가 필요하다. 화(火)로제련하고 수(水)로 씻어내야 한다. 나무를 심으면 충분한 결실을 얻을 수 있으므로 재물을 얻거나 결과를 얻을 수 있고 승진을 하는 직장생활이 적성에 맞고, 보석을 만들면 보석이 빛나는 것처럼 인기를 얻는 연예, 예술, 방송, 교육, 언론 분야의 직업이 좋다.' },
                    { a: '庚', b: '庚', c: '반음중금(反吟重金)·앙금상살(兩金相殺)', d: '바위산이 겹쳐 있는 형상 또는 2개의 금(金)이 서로 싸우는 형상', e: '금강산처럼 큰 바위산이 겹쳐 있는 형상 또는 바위 사막이 끝없이 펼쳐진 형상이다. 이런 물상은 역마살을 상징한다. 움직임이 크면서도 자신을 잘 관리하지 않으면 사막에서 살아가기 힘들기 때문에 계획적이고 철저하게 구조화되어 있는 사람이다. 금(金)을 제련하려면 화(火) 기운이 2~3개 이상 있어야 하고, 수(水)도 있어야 한다. 철쭉, 풍란, 소나무가 자라려면 먼저 수(水)나 토(土)가 2~3개 갖추어진 다음에 목(木)이 있어야 한다.' },
                    { a: '庚', b: '辛', c: '철추쇄옥(鐵鐵碎玉)·철옥금실(鐵玉金寶)', d: '큰 도끼로 보석을 깨뜨리는 형상 또는 철과 보석과 금(金)이 가득한 형상', e: '바위산에 저장되어 있는 보석의 형상이다. 자칫 병화(丙火)로 제련하면 보석이 녹을 수 있으 므로 정화(丁火)로 제련하는 것이 좋다. 지지에서 화(火)로 경금(庚金)을 녹여주고, 천간에서 정화(丁火)로 신금(辛金)을 분리하고 다시 한번 제련하면 1차 완성이 되는 물상이다. 그 다음에 수(水)로 이물질을 씻어내면 화려하고 아름다운 보석이 되므로, 보석처럼 빛나는 인기를 가지고 가는 직업인 연예, 예술, 방송, 문학, 교육, 정치 등에 어울린다.' },
                    { a: '庚', b: '壬', c: '특수이청(得水而清)·금수쌍청(金水雙清)', d: '물을 얻어 맑아지는 형상 또는 바위산(쇳덩어리)과 강물이 만나 서로가 빛나는 형상', e: '바위산에 커다란 계곡물이 흐르는 형상 또는 넓은 바위 사막에 큰 오아시스가 흐르는 형상이 므로 최고의 물상이라고 할 수 있다. 있어야 할 공간에 있을 것이 있는 물상이므로 자기 것을 잘 관리하고, 머리도 총명하고, 의식주도 풍족하다.  물에 떠내려 가거나 물에 잠겨버리지 않 게 토(土)나 금(金)이 좀더 있으면 좋겠고, 메마르지 않게 수(水)도 좀더 있으면 좋을 것이다. 그 다음에 목(木)의 나무를 심거나, 화(火)로 바위를 제련하여 보석을 얻으면 금상첨화다.' },
                    { a: '庚', b: '癸', c: '보도이로(寶刀已老)·석산접로(石山接露)', d: '보검이 이미 녹슬어버린 형상 또는 바위산에 이슬이 내리는 형상', e: '바위산 또는 넓은 바위 사막에 이슬이 내리는 형상이므로 무엇보다 갈증을 해소할 수 있게 수(水)가 2~3개 이상 있는 것이 우선이다. 바위산 또는 사막에서 살아 남으려면 자기 관리가 철저해야 하므로 계획적이고 원칙적이며 단계적인 타입이다. 수(水)가 2~3개 이상 있으면 사막에서 오아시스를 만난 형상이므로 여유로운 삶을 누리고, 평생 의식주가 풍족할 것이다. 또한 나무를 심어 그늘을 만들고 곡식이나 과일을 얻을 수 있으면 더욱 풍성한 결실을 얻 으므로 재물까지 풍족해질 수 있다. 바위산에 먼저 물을 보충하고 불을 얻으면 보석을 얻을 수 있다. 이 때는 먼저 수(水)를 얻 고, 다음으로 화(火)로 제련해주는 것이 우선이다.' },
                    { a: '庚', b: '庚 삼존or 사존', c: '무중광산(武中鑛山)/거석고쇄(巨石高碎)', d: '끝없이 펼쳐진 광산, 크고 높은 돌산의 형상', e: '여러 개 겹쳐 있는 바위산 또는 매장량이 무궁무진한 광산의 형상이다. 바위산에는 나무 목(木)이 있으면 좋고, 금광이 풍부한 광산에는 불 화(火)나 물 수(水)가 필요하다. 그 중에서 먼저 불이 필요하다. 왜냐하면 불이 풍족하면 금광석을 충분히 제련할 수 있기 때문이다.' }
                ]
            },
            {
                id: 'sin', name: '신 (辛)',
                items: [
                    { a: '辛', b: '甲', c: '단도목편(短刀木片)·월하송영(月下松影)', d: '작은 칼로 나무를 베는 형상 또는 달 아래 소나무 그림자의 형상', e: '나무를 가지치기하여 결실을 잘 맺게 할 것인가 아니면 장작을 만들어 훌륭한 땔감으로 쏠 것인가. 이 둘 중에 무엇이 먼저인지를 판단해야 한다. 먼저 가지치기의 물상이라면 나무 한 그루가 혼자 꽃가루를 주고받고 열매를 맺을 수는 없 으므로 나무가 몇 그루 더 있어야 꽃가루받이를 하여 좋은 열매를 맺을 수 있다. 다음으로, 적당한 가지치기를 위해 적당한 금(金)이 필요하고, 그 다음에 물이 있거나 흙의 영양분이 있 어도 좋고, 태양빛이 있어도 무방하다. 그러나 땔감의 형태라면 먼저 땔감의 목(木)과 도끼의 금(金)이 적당히 갖추어진 후에, 불로 지펴야 하므로 화(火)가 필요하다.' },
                    { a: '辛', b: '乙', c: '이전최화(利剪摧花)', d: '전지가위로 꽃을 꺾는 형상', e: '화초나 식물을 가지치기하는 형상이므로 을목(乙木)의 화초나 식물이 잘 자라서 씨앗을 잘 을 수 있는 기초가 되는 물상이다. 다만, 한 포기의 화초나 식물로는 꽃가루를 주고받거나 충분히 생산하기 어려우므로 목 의 식물이나 화초가 몇 포기 더 필요하다. 한편 여러 포기의 식물이나 화초가 있으면 그만큼의 전지가위가 있어야 하므로 금(金) 요하다. 이후에 적당한 토(土)의 흙이 있어서 영양을 주거나, 적당한 수(水)의 물이 있어서 화 식물이 잘 자라게 하면 더욱 좋다. 토(土)나 수(水)가 없는 경우에 햇살이나 적당한 온도가 필요하므로 화(火)도 무난하다.' },
                    { a: '辛', b: '丙', c: '간합패사(干合覇師)', d: '천간이 합해서 스승의 자리에 오르는 형상 또는 보석을 불로 녹여 물로 만드는 형상', e: '보석을 제련할 때 약간의 불로 조심스럽게 해야 하는데 용광로에 던져 넣는 형상이므로 먼저 금(金)이 녹지 않도록 금(金)을 보강하는 것이 우선이다. 다음으로, 토(土)의 흙에서 금(金)을 더 많이 생산하여 충분히 제련할 수 있게 해야 한다.' },
                    { a: '辛', b: '丁', c: '화소주옥(火燒珠玉)', d: '제련되어 완성된 보석을 또 다시 다듬는 형상', e: '보석을 더욱 섬세하게 다듬어 능력을 최대한 발휘할 수 있다. 보석이 빛나는 것처럼 섬세함 이 필요한 직업 또는 사람들에게 인기를 얻는 직업이 잘 어울린다. 다만, 보석 하나에 제련하는 작은 불뿐이므로, 자칫 보석 하나를 가지겠다고 덤벼드는 사 람들이 많아 재물이 새 나가거나 인덕이 없을 수 있다. 이런 경우 먼저 보석이 몇 개 더 있거나 보석의 재료가 될 수 있는 양금(陽金)의 바위산 또는 토(土)의 땅이 있으면 좋다. 어느 정도 광석이 발견된 다음에는 화(火)가 좀더 있어서 충분히 제련하면 좋고, 제련한 후 에는 반드시 물로 씻어내야 하므로 수(水)의 물이 필요하다.' },
                    { a: '辛', b: '戊', c: '반음피상(反吟被傷)·전답주옥(田沓珠玉)', d: '논과 밭에 있는 보석의 형상', e: '커다란 흙산 또는 넓은 들판의 흙 속에 있는 보석의 형상이다. 이 경우 보석을 제대로 활용하 려면 먼저 보석을 캘 수 있는 금(金)의 삽, 곡괭이, 호미 등이 필요하므로 금(金)이 2~3개 이상 더 있으면 좋고, 또한 흙 속에 파묻혀 있던 보석이므로 수(水)의 물로 깨끗이 씻어내면 더욱 좋다. 금(金)을 보석으로 활용하지 않고 생활도구로 활용한다면 나무를 심어야 하므로 목(木)이 2~3개 이상 있으면 좋고, 나무의 가지를 정리하는 금(金)이 2~3개 더 필요하며, 다음으로 물 의 수(水)나 태양의 화(火)가 있으면 더욱 좋다.' },
                    { a: '辛', b: '己', c: '입옥자형(入獄自刑)·토출주옥(土出珠玉)', d: '스스로 죄를 저지르고 감옥에 들어가는 형상 또는 흙 속에서 보석을 캐내는 형상', e: '전원의 흙 속에 파묻혀 있는 보석 또는 생활도구의 형상이다. 먼저 보석은 물로 씻어내야 하 는데, 금(金)이 약하면 물로 씻어내면서 모두 떠내려갈 수 있으므로 먼저 금(金)의 보석이 더 있으면 좋다. 그 다음에는 수(水)의 물로 씻어내면 좋다. 또한 생활도구로 본다면, 나무를 자르는 도구로 활용할 때는 먼저 토(土)의 땅이 있어야 하고, 다음으로 나무 목(木)이 있은 후에 금(金)으로 가지치기를 하면 최상의 물상이 될 것이다.' },
                    { a: '辛', b: '庚', c: '백호출력(白虎出力)·금성옥진(金聲玉振)', d: '백호가 용맹스럽게 뛰어나오는 형상 또는 금과 옥이 넘쳐나는 형상', e: '경신(庚辛) 병존과 비슷한 물상이다. 바위산에 저장되어 있는 보석으로, 보석이 녹지 않게 병 화(丙火)의 강력한 불보다는 약한 불인 정화(丁火)로 제련하여 수(水)의 물로 씻어내면 가장 좋 은 물상이다. 사주에 토(土)가 있으면 화초나 나무 등을 심어 결실을 맺게 하거나 꽃을 감상할 수 있는데, 이렇게 목(木)이 있으면 금(金)을 톱, 낫, 전지가위 등의 생활도구로 활용하여 나무가 웃자라 지 않고 꽃이나 열매로 양양분이 고루 갈 수 있도록 가지치기를 해주는 것도 매우 좋다..' },
                    { a: '辛', b: '辛', c: '복음상극(伏吟相剋)·보석진기(寶石眞氣)', d: '금(金)이 너무 겹쳐 서로 극하는 형상 또는 보석이 빛을 발하는 형상', e: '날카로운 생활도구 또는 보석만 둥그러니 있는 물상이다. 이들을 활용하기 위한 방법은 다음 과 같다. 먼저 생활도구로 활용할 때는 나무를 잘라주는 전지가위로 보아서 목(木)이 있으면 좋고, 목(木)의 나무가 갖추어진 다음에는 수(水) 또는 화(火)가 있어 나무를 잘 자라게 해주면 더욱 좋다. 또한 보석의 물상으로 보면, 물의 수(水)로 이물질을 씻어주는 것이 좋다. 자칫 금(金)의 보 석이 떠내려갈 수 있으므로 흙으로 물을 가두어주면 금상첨화다.' },
                    { a: '辛', b: '壬', c: '도세주옥(淘洗珠玉)·주옥강출(珠玉江出)', d: '보석을 물로 씻어내는 형상 또는 보석을 강에서 꺼내는 형상', e: '보석을 강물로 씻어내므로 보석이 더욱 빛나는 형상이다. 그러므로 사람들에게 더욱 아름답 게 보이고, 반짝거릴 것이다. 이들은 연예, 방송, 문학 방면의 인기를 얻는 직업이 어울린다. 다만, 강물이라서 보석이 떠 내려갈 수 있으므로 금(金)이 좀더 있어서 충분히 물을 극복하면 좋을 것이다. 또한 물을 잘 가둘 수 있는 토(土)가 있어도 매우 좋은 물상이다. 재산이 잘 새 나가지 않고 부동산 등 고정자산을 늘려가는 데 능력을 발휘하게 된다.' },
                    { a: '辛', b: '癸', c: '천뢰화개(天牢華蓋)·금수쌍청(金水雙清)', d: '천둥번개가 세상을 뒤흔드는 형상 또는 보석이 물에 씻겨 더욱 빛을 발하는 형상', e: '보석에 아침 이슬이 내린 형상이므로 보석이 더욱 반짝이고 빛날 것이다. 다만, 너무 작아서 몇 사람밖에 쳐다보지 않기 때문에 금(金)의 보석 그리고 이슬이나 물의 수(水)가 사주 내에 더 있으면 최고의 물상이라고 할 수 있다. 물이 너무 많으면 토(土)가 있어서 물을 가두어주는 것이 좋고, 화(火)가 너무 많아 금(金)이 지나치게 녹이면 물이 있어 수(水)로 불을 줄여주는 것이 좋다. 토(土)가 너무 많으면 광산으로 묵히기에는 너무 많은 논밭이므로 나무를 심는 것이 좋 물상이다.' },
                    { a: '辛', b: '辛 삼존or 사존', c: '무중광산(武中鑛山)/거석고쇄(巨石高碎)', d: '보석이 가득 가득 쌓여 있는 형상', e: '보석과 식생활에 활용하는 생활도구나 전자제품을 상징하므로 누군가에게 보여주거나 직접 도움을 주는 직업이 좋으며, 이런 물상을 가진 사주는 인덕이 있고 참을성이 매우 강하다.  화(火)가 있어서 좀 더 제련할 수 있으면 좋고, 물 수(水)로 깨끗하게 씻어서 더욱 빛나게 해도 좋다. 나무 목(木)이 있으면 낫이나 도끼가 되어 가지치기를 하거나 수확을 하는 형상이므로 수확량이 많아서 재물복이 넘친다.' }
                ]
            },
            {
                id: 'im', name: '임 (壬)',
                items: [
                    { a: '壬', b: '甲', c: '수중유영(水中柳影)·우중수목(雨中樹木)', d: '물 속에 비친 버드나무 그림자 또는 비 내리는 가운데 서 있는 나무 한 그루의 형상', e: '강가에 서 있는 버드나무 또는 미루나무에 비가 내리는 형상으로, 나무가 자라기에 매우 좋 은 환경이라고 할 수 있다. 다만, 나무가 외로울 수 있으므로 목(木)이 2~3개 더 있으면 좋을 것이다. 그리고 비가 지 나치게 많이 내리면 나무가 썩을 수 있으므로 화(火)의 태양빛이 어느 정도 있으면 최상이 될 것이다.' },
                    { a: '壬', b: '乙', c: '출수홍련(出水紅蓮)·우중지란(雨中芝蘭)', d: '물 속에서 피어난 연꽃 또는 빗속에 핀 난초의 형상', e: '난초 하나 외로이 있는데 비가 쏟아지는 형상 또는 호수 위에 외로이 떠 있는 한 송이 연꽃의 형상이므로 외롭고 인덕이 부족하다. 이 때는 반드시 나무나 화초 등의 목(木)이 2~3개 이상 모여 있어야 생명력도 길고 보기에 도 아름답다. 이 물상은 인덕이 있고 사람들에게 지식이나 끼로 즐거움을 주는 직업에 적성이 있다. 직접 결실을 맺기보다는 누군가의 조언자가 되는 교육자, 상담가, 카운슬러, 기획가도 좋은 직업이다.' },
                    { a: '壬', b: '丙', c: '강휘상영(江暉相暎)·수중일조(水中日照)', d: '태양이 강을 비추고 있는 형상 또는 물 속에 비친 태양의 형상', e: '태양이 호수나 강물 위에 비치는 형상이므로 물이 더욱 맑고 태양이 더욱 빛난다. 하늘에도 태양이 떠 있고 물 속에도 태양이 떠 있어 윗사람들이 바라보며 감탄하는 형상이므로 연예, 예술, 방송, 문학, 교육 등의 분야에 적성이 있다. 물가에 버드나무가 2~3그루 이상 있으면 편히 쉬면서 호수도 구경하고 하늘도 구경할 수 있는 물상이다. 물을 가둘 수 있는 토(土)가 있어서 호수가 넘치거나 강물이 넘치지 않도록 막아주는 것도 매우 좋다.' },
                    { a: '壬', b: '丁', c: '간합성기(干合星奇)·수중월조(水中月照)', d: '천간이 합을 이룬 기이한 별의 형상 또는 물 속에 비친 달빛의 형상', e: '호수 위에 떠 있는 달빛의 형상 또는 비 내리는 날 가로등 불빛의 형상으로, 약간은 쌀쌀하고 외로워 보이면서도 아름다운 경치다. 사람들에게 받는 인덕은 없지만, 사람들이 바라보아주는 인기나 명예를 얻는 직업에 적성 이 맞는다. 다만, 언제 꺼질지 모르는 작은 불빛이라서 화(火)의 불빛이 좀더 있으면 좋고, 물이 넘치지 않도록 토(土)가 있어도 좋을 것이다. 사주에 금(金)이 있으면 화(火)로 제련하여 물로 씻어내면 더욱 빛나는 보석이 되므로 이 또 한 멋진 물상이다.' },
                    { a: '壬', b: '戊', c: '산명수수(山明水秀)·우수대지(雨水大地)', d: '산은 밝고 물은 빼어난 형상 또는 대지에 비가 내리는 형상', e: '호수의 물을 가득 가두고 있는 제방의 모습 또는 넓은 들판에 내리는 빗물의 형상이므로, 물을 마음대로 잘 관리하고 저장하거나 흡수하여 활용할 수 있는 여유와 적극성이 있다. 인덕 도 있고 배짱도 있다. 충분한 비나 물을 얻는 수(水)가 있으면 좋은 물상이고, 물이 더 있고 제방이나 들판이 더 넓으면 좋다. 다음으로, 기름진 땅에 나무나 화초를 심는 것이 좋고, 목(木)이 있으면 결실을 맺을 수 있 으므로 재물복이 크거나 명예가 크다.' },
                    { a: '壬', b: '己', c: '기토택임(己土澤壬)', d: '호수에 흙탕물이 흘러들어오는 형상 또는 강물에 물고기가 살 수 있는 적당한 영양분이 있는 형상', e: '비가 쏟아지는데 화단이나 정원의 흙이 떠내려가는 형상이므로 먼저 토(土)가 있어야 한다. 다음으로, 토(土)가 물에 떠내려가지 않게 목(木)의 나무, 화초, 식물 등을 심을 수 있으면 최 고의 물상이 된다. 토(土)가 있지만 물을 막는 정도만 있어서 결실이 없으므로 참모, 연구, 교육 등의 분야가 어울리고, 나무를 심을 수 있으면 사업, 책임자, 리더 역할도 충분히 해낸다.' },
                    { a: '壬', b: '庚', c: '경발수원(庚發水源)·금수쌍청(金水雙淸)', d: '바위산에서 맑고 큰 계곡물이 시작되는 형상 또는 강물 속에 잠겨 있는 커다란 광석의 형상', e: '커다란 바위산에 비가 내리는 형상 또는 호수에 잠겨 있는 광석의 형상이므로 바위산 위에 나무를 심는 것이 좋고, 화(火)로 경금(庚金)을 제련하는 것도 좋다. 바위산의 계곡에 넘치는 물을 막기 위해 토(土)가 있으면 가장 좋은 물상이 될 것이다. 나무의 결실을 얻거나 금(金)을 제련하여 보석을 만들 수 있으면 충분히 리더나 책임자기 될 수 있고, 재물도 풍족할 것이다.' },
                    { a: '壬', b: '辛', c: '도세주옥(淘洗珠玉)', d: '강물 또는 시냇물에 씻기고 닦여서 빛나는 보석의 형상', e: '강물이나 호수에 빠진 보석 또는 보석 위에 쏟아지는 빗줄기의 형상이므로 보석이 물에 휩쓸 려 사라질 위기에 처해 있다. 이 때는 금(金)의 보석이나 광석이 힘이 되어주거나, 토(土)로 물을 막아주는 것도 좋다. 또한 화(火)가 있어 밝게 비추면 강물이나 호수가 더욱 빛나고, 물은 썩지 않을 것이다.' },
                    { a: '壬', b: '壬', c: '왕양대해(汪洋大海)·강중강우(江中强雨)', d: '바다나 강이나 호수에 내리는 장대비의 형상', e: '넓은 바다나 호수의 형상으로, 욕망과 열정이 있고, 대범하고 힘이 있다. 탁 트인 광경이 많은 사람들에게 바라보는 즐거움을 주듯이 사람들에게 인기가 많다. 사주에 어떤 오행이 있는가에 따라 물상이 달라지는데, 금(金)의 금속이나 보석이 있으면 기계를 만지거나 보석을 만지는 일 또는 연구가 어울린다.' },
                    { a: '壬', b: '癸', c: '강중세우(江中細雨)', d: '강에 내리는 가는 빗줄기의 형상', e: '커다란 호수, 강, 바다에 이슬비나 가랑비가 내리는 형상이므로 약간은 쓸쓸해 보이고, 우수에 잠긴 듯 조용한 경치다. 연구나 사색이 필요한 문학, 연구, 개발 분야의 직업이 어울린다. 꽃이 피어 있는 형상으로 을목(乙木)이나 묘목(卯木)이 있으면 예술, 연예, 방송 분야가 어울리고, 보석이나 금속에 해당하는 금(金)이 있으면 금을 닦는 일이나 기계적인 일 즉 기계공학, 반도체공학, 전기공학, 보석공예 등이 어울린다.' },
                    { a: '壬', b: '壬 삼존or 사존', c: '강류대해(江流大海)', d: '강이 흘러서 바다를 이룬 형상', e: '강물이 흘러 바다를 이루듯이 끊임없이 노력하고 열정적으로 밀고 나가면 커다란 결과를 얻게 된다. 강물이 흘러갈 때는 힘들고 고생스럽지만 반드시 바다에 이르는 성공을 이룰 것이다. 강물과 바닷물에 햇살이 반짝이고 별빛과 달빛이 비추어 반짝이므로 병정(丙丁)이나 사오(巳午) 등의 화(火)가 있으면 예술, 연예, 방송 분야에서 크게 인정받는 인물이 될 것이다.' }
                ]
            },
            {
                id: 'gye', name: '계 (癸)',
                items: [
                    { a: '癸', b: '甲', c: '양류감로(楊柳甘露)', d: '버드나무에 이슬이 내리는 형상', e: '홀로 서 있는 나무 위에 이슬비가 내리는 형상이다. 큰 나무 한 그루가 이슬비를 맞고 있는 형 상이므로 나무가 조금은 갈증을 느낄 수 있는 상태이다. 충분한 양의 물이 필요하므로 수(水)가 있어야 하고, 한 그루 나무는 외롭고 비바람에 노출 되어 언제든지 뽑힐 수 있으므로 나무가 2~3그루 더 있어 의지할 수 있어야 인덕도 있고 하는 일에 결실도 크다. 나무가 잘 자라도록 영양을 주는 토(土)도 필요하고, 햇빛이 내리쬐는 화(火)도 필요하다.' },
                    { a: '癸', b: '乙', c: '이화춘우(梨花春雨)', d: '배꽃이 봄비를 만나는 형상', e: '홀로 핀 꽃(난초) 위에 이슬이 내리는 형상이므로 사람의 마음을 흔드는 을씨년스러우면서 쓸 쓸함이 묻어나는 물상이다. 따라서 성격이 조용하고 내성적이며 감수성이 발달되어 있고, 소 수의 사람들과 친하고 그들과 일하는 것을 좋아한다. 화초나 나무와 같은 목(木)과, 충분한 수 분을 보충할 수 있는 수(水)가 동시에 2~3개 이상 있으면 만족스러운 물상이다. 화초나 나무 가 자랄 수 있는 토(土)가 있으면 금상첨화이고, 실제로 자기의 이익을 스스로 창출해낸다.' },
                    { a: '癸', b: '丙', c: '개화감로(開花甘露)', d: '활짝 핀 꽃이 이슬비를 만난 형상', e: '태양이 세상을 비추는데 계수(癸水)의 이슬비나 가랑비가 내리는 형상 또는 도랑에 고여 있 는 아주 작은 물의 형상이므로 금세 뜨거운 태양의 열기에 메마를 위기에 처해 있다.  먼저 수(水)를 충분히 가리는 것이 우선이고, 다음으로는 따뜻한 태양빛이 필요하다.' },
                    { a: '癸', b: '丁', c: '등사요교(螣蛇妖嬌)', d: '뱀이 미소를 짓는 형상 또는 달빛 하늘에 내리는 이슬의 형상', e: '달이 뜬 하늘에서 내리는 이슬비 또는 작은 샘을 비추는 달빛 또는 작은 우물물에 피어 있는 수선화의 형상이다. 내성적이고 외로움을 잘 타며, 감수성이 발달하여 예술적문학적 감각이 있다. 아이디어나 창조성도 뛰어나서 기술개발, 연구 등의 분야에 적성이 있다. 다만, 금방 말라버릴 수 있는 이슬비나 물이므로 끈기가 부족하고, 매사에 소심해질 수 있다. 따라서 수(水)가 좀더 강하 화(火)도 좀더 강하면 좋을 것이다.' },
                    { a: '癸', b: '戊', c: '천을회합(天乙會合)·전답세로(田沓細露)', d: '천간이 무계화합(戊癸火合)을 하는 형상 또는 넓은 논밭에 내리는 이슬비', e: '넓은 들판에 내리는 이슬비이므로 식물을 심기에는 땅이 메마르다. 먼저 수(水)로 물을 보충 해주고, 다음으로 좀더 넓은 들판 위에 나무를 심으면 최상의 결실을 얻을 수 있다.' },
                    { a: '癸', b: '己', c: '습윤옥토(濕潤沃土)', d: '기름진 정원의 흙을 상징', e: '정원에 촉촉하게 내리는 이슬비 또는 가랑비의 형상이므로 작은 나무나 꽃이 자라기에는 관심 은 조건이다. 다만, 여러 그루의 나무를 심기에는 땅과 물이 부족하므로 좀더 넓은 땅과 물이 필요하다. 성격은 안정적이고, 가까운 사람과 친밀도는 매우 높지만 새로운 공간에서 새로운 사람과 의 만남을 어색해한다. 안정적인 직장이 어울리며, 전문직이 무난하다. 그러나 독립적인 사 업이나 정치처럼 리더십을 발휘하는 일은 굴곡이 심하다.' },
                    { a: '癸', b: '庚', c: '암산세로(岩山細露)', d: '바위산에 내리는 가랑비나 이슬의 형상', e: '바위산에 내리는 이슬비의 형상이므로 작은 나무라도 바위틈에서 살아가기 힘들다. 먼저 수(水)의 기운이 더 강해서 비를 내려주거나 계곡물이 갖추어진 다음에 나무가 필요하다. 뿌리 가 튼튼한 나무여야 하므로 인묘목(寅卯木)이 유리하다.' },
                    { a: '癸', b: '辛', c: '양쇠음성(陽衰陰盛)·금수쌍청(金水雙清)', d: '양의 기운은 쇠퇴하고 음의 기운은 무성해지는 형 상 또는 금수(金水)가 나란히 맑게 빛나는 형상', e: '보석과 물방울이 반짝이는 형상이므로 총명하고 감각이 발달하여 연구나 이과 또는 수리적 능력이 뛰어나고, 음악이나 연기와 같은 암기력과 모방능력이 필요한 일에 유리하다.' },
                    { a: '癸', b: '壬', c: '천진지양(天津之洋)·강중세로(江中細露)', d: '하늘과 땅을 잇는 나루터의 형상 또는 강에 내리 는 이슬이나 가랑비의 형상', e: '커다란 호수에 추적추적 내리는 가랑비의 모습이므로 스산하고 조용한 기운이 가득하다. 감각이 예민하고 감수성이 발달하여 자연의 작은 변화에도 민감하게 반응하는 타입이므로 섬세하고 미세한 부분까지 파악해야 하는 수리, 수학, 미생물, 생명공학, 반도체, 컴퓨터 공학 등이 어울리고, 예술, 연예, 문학 등에도 어울린다. 스산하고 을씨년스러운 기운이 있는 물상이므로 태양의 화(火) 또는 물을 가둘 수 있는 토 (土)가 있으면 매우 좋을 것이다.' },
                    { a: '癸', b: '癸', c: '세로중우(細露中雨)', d: '이슬이 내려 비가 되는 형상', e: '하염없이 내리는 이슬비의 형상이므로 사람 또한 스산하고 조용하며 우울해지거나 감수성이 발달하게 된다. 민감하고 예리한 감수성을 바탕으로 하는 수리, 수학, 미생물, 생물공학, 반도체, 컴퓨터 또 는 예술, 연예, 문학 등에 어울리는 타입이다. 충분한 햇살과 논밭이 있으면 좋고, 서로 의지할 수 있고 충분히 수확이 가능한 나무도 필요하다.' },
                    { a: '癸', b: '癸 삼존or 사존', c: '천운노로(天雲露路)', d: '하늘의 흰 구름과 길가의 이슬처럼 맑고 투명하게 빛나는 형상', e: '이슬이 투명하게 비추고 있는 형상 또는 이슬비나 가랑비가 온 세상에 촉촉하게 내리는 형상이다. 안개가 자욱한 날에 가늘고 조용한 비가 내리니 추억에 잠기고 마음이 설레고 가라앉듯이, 사색적이 되거나 감상적이 되어 문학적, 연예적인 기질을 발휘하게 된다. 또한 생각을 많이 하고 감상에 젖고, 수학적 기질도 강하다. 다만, 지나치게 사색과 감상에 빠져 우울해지기 쉬우니 조심한다.' }
	                ]
            }
        ];

        // 좌측 메뉴 생성
        const menuContainer = document.getElementById('menu-container');
        stemsData.forEach((stem, index) => {
            const btn = document.createElement('button');
            btn.className = `menu-btn p-3 rounded-xl text-center font-medium text-sm transition-all duration-200 border border-slate-800 ${index === 0 ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 border-indigo-500' : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800 hover:text-white'}`;
            btn.innerHTML = `<span class="block text-base font-bold">${stem.name}</span>`;
            
            btn.addEventListener('click', () => {
                document.querySelectorAll('.menu-btn').forEach(b => {
                    b.className = 'menu-btn p-3 rounded-xl text-center font-medium text-sm transition-all duration-200 bg-slate-800/60 text-slate-300 hover:bg-slate-800 hover:text-white border border-slate-800';
                });
                btn.className = 'menu-btn p-3 rounded-xl text-center font-medium text-sm transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 border-indigo-500';
                
                renderContent(stem);
                if (window.innerWidth < 768) toggleSidebar(false);
            });

            menuContainer.appendChild(btn);
        });

        // 우측 내용 프레임 렌더링 함수
        function renderContent(stem) {
            document.getElementById('current-stem-title').textContent = `${stem.name} 병존 물상`;
            const contentBody = document.getElementById('content-body');
            contentBody.innerHTML = '';

            const banner = document.createElement('div');
            banner.className = 'bg-gradient-to-r from-indigo-900 to-slate-900 text-white p-6 rounded-2xl shadow-md mb-6';
            banner.innerHTML = `
                <h3 class="text-xl font-bold mb-1">${stem.name} 일간 병존 물상론</h3>
            `;
            contentBody.appendChild(banner);

            stem.items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col space-y-3 transition-all hover:shadow-md';
                
                // 일간과 일간외 육친 계산
                let ilganGod = getTenGod(item.a, item.a);
                let otherGod = getTenGod(item.a, item.b);

                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span class="bg-slate-900 text-white text-xs font-bold px-2.5 py-1 rounded-lg">No. ${idx + 1}</span>
                            <span class="bg-slate-900 text-white text-sm font-bold px-3 py-1 rounded-md">일간: ${item.a} (${ilganGod})</span>
                            <span class="text-slate-400 font-bold">+</span>
                            <span class="bg-indigo-100 text-indigo-800 text-sm font-bold px-3 py-1 rounded-md">일간 외: ${item.b} (${otherGod})</span>
                        </div>
                    </div>
                    <div class="mt-2">
                        <div class="mb-2">
                            <span class="text-lg font-bold text-slate-900 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-lg inline-block">물상: ${item.c}</span>
                        </div>
                        <h4 class="text-sm font-semibold text-slate-700 mb-1 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                            물상의 의미: ${item.d}
                        </h4>
                        <p class="text-slate-600 text-sm leading-relaxed whitespace-pre-line mt-2 bg-slate-50 p-3 rounded-xl border border-slate-100">내용: ${item.e}</p>
                    </div>
                `;
                contentBody.appendChild(card);
            });
        }

        // 초기 실행 (갑 일간)
        renderContent(stemsData[0]);

        // 모바일 사이드바 토글 로직
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileCloseBtn = document.getElementById('mobile-close-btn');

        function toggleSidebar(open) {
            if (open) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        mobileMenuBtn.addEventListener('click', () => toggleSidebar(true));
        mobileCloseBtn.addEventListener('click', () => toggleSidebar(false));
        overlay.addEventListener('click', () => toggleSidebar(false));
    </script>
</body>
</html>
