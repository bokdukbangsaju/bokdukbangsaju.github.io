<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일간별 12운성 사인곡선(Simple Harmonic Motion) 대시보드</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 1.6rem;
            color: #1e293b;
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        label {
            font-weight: 600;
            color: #475569;
        }
        select {
            padding: 8px 15px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .info-card {
            margin-top: 25px;
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            color: #166534;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>☯️ 일간별 12운성 사인곡선(Sine Wave) 분석기</h1>
    <p class="subtitle">제왕(+1)과 절(-1)을 극점으로 하는 단순조화운동(단진자·용수철 모델) 에너지 시뮬레이션</p>
    
    <div class="controls">
        <label for="stemSelect">일간(Stem) 선택:</label>
        <select id="stemSelect" onchange="updateChart()">
            <option value="甲">甲 (갑목)</option>
            <option value="乙">乙 (을목)</option>
            <option value="丙">丙 (병화)</option>
            <option value="丁">丁 (정화)</option>
            <option value="戊">戊 (무토)</option>
            <option value="己">己 (기토)</option>
            <option value="庚">庚 (경금)</option>
            <option value="辛">辛 (신금)</option>
            <option value="壬">壬 (임수)</option>
            <option value="癸">癸 (계수)</option>
        </select>
    </div>

    <div class="chart-container">
        <canvas id="wunseongChart"></canvas>
    </div>

    <div id="infoText" class="info-card">
        <strong>현재 선택된 일간 설명:</strong> 甲목 일간은 卯(묘)에서 제왕(+1)을 맞이하고, 申(신)에서 절(-1)을 맞이하는 정현파(Sine Wave) 운동을 그립니다.
    </div>
</div>

<script>
    // 12지지 정의
    const branches = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

    // 12운성별 표준 사인파 에너지 값 매핑 (제왕=1.0, 절=-1.0 기준 정밀 수치)
    const stageValues = {
        '제왕':  1.0,
        '건록':  0.866,
        '관대':  0.5,
        '장생':  0.2,
        '목욕':  0.0,
        '관대_': 0.5,
        '쇠':    0.5,
        '병':    0.0,
        '사':   -0.5,
        '묘':   -0.866,
        '절':   -1.0,
        '태':   -0.866,
        '양':   -0.5
    };

    // 업로드된 엑셀 기반 10천간별 12운성 배치 데이터
    const stemDataMap = {
        '甲': ['목욕', '관대', '건록', '제왕', '쇠', '병', '사', '묘', '절', '태', '양', '장생'],
        '乙': ['병', '쇠', '제왕', '건록', '관대', '목욕', '장생', '양', '태', '절', '묘', '사'],
        '丙': ['태', '양', '장생', '목욕', '관대', '건록', '제왕', '쇠', '병', '사', '묘', '절'],
        '丁': ['절', '묘', '사', '병', '쇠', '제왕', '건록', '관대', '목욕', '장생', '양', '태'],
        '戊': ['태', '양', '장생', '목욕', '관대', '건록', '제왕', '쇠', '병', '사', '묘', '절'],
        '己': ['절', '묘', '사', '병', '쇠', '제왕', '건록', '관대', '목욕', '장생', '양', '태'],
        '庚': ['사', '묘', '절', '태', '양', '장생', '목욕', '관대', '건록', '제왕', '쇠', '병'],
        '辛': ['장생', '양', '태', '절', '묘', '사', '병', '쇠', '제왕', '건록', '관대', '목욕'],
        '壬': ['제왕', '쇠', '병', '사', '묘', '절', '태', '양', '장생', '목욕', '관대', '건록'],
        '癸': ['건록', '관대', '목욕', '장생', '양', '태', '절', '묘', '사', '병', '쇠', '제왕']
    };

    // 툴팁에 표시할 12운성 명칭 매핑 배열 생성 함수
    function getNumericValues(stem) {
        const stages = stemDataMap[stem];
        return stages.map(st => {
            // 표준 점수 부여
            switch(st) {
                case '제왕': return 1.0;
                case '건록': return 0.866;
                case '관대': return 0.5;
                case '장생': return 0.2;
                case '목욕': return 0.0;
                case '쇠': return 0.5;
                case '병': return 0.0;
                case '사': return -0.5;
                case '묘': return -0.866;
                case '절': return -1.0;
                case '태': return -0.866;
                case '양': return -0.5;
                default: return 0.0;
            }
        });
    }

    // Chart.js 초기화
    const ctx = document.getElementById('wunseongChart').getContext('2d');
    let wunseongChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: branches,
            datasets: [{
                label: '甲목 12운성 에너지 파동 (Sine Wave)',
                data: getNumericValues('甲'),
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointRadius: 6,
                pointBackgroundColor: '#2563eb'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    min: -1.2,
                    max: 1.2,
                    grid: { color: '#e2e8f0' },
                    ticks: {
                        callback: function(value) {
                            if (value === 1) return '제왕 (+1)';
                            if (value === 0) return '평형점 (0)';
                            if (value === -1) return '절 (-1)';
                            return value;
                        }
                    }
                },
                x: {
                    grid: { display: false }
                }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const stem = document.getElementById('stemSelect').value;
                            const stage = stemDataMap[stem][context.dataIndex];
                            return ` 12운성: ${stage} (에너지 값: ${context.parsed.y})`;
                        }
                    }
                }
            }
        }
    });

    // 선택 변경 시 차트 실시간 업데이트 함수
    function updateChart() {
        const stem = document.getElementById('stemSelect').value;
        const newData = getNumericValues(stem);
        
        wunseongChart.data.datasets[0].label = `${stem}일간 12운성 에너지 파동 (Sine Wave)`;
        wunseongChart.data.datasets[0].data = newData;
        wunseongChart.update();

        // 하단 설명 업데이트
        const stages = stemDataMap[stem];
        document.getElementById('infoTextinnerHTML = `<strong>${stem}일간 특성:</strong> 12지지별 순환 흐름이 반영되었습니다. (예: 자(子)=${stages[0]}, 묘(卯)=${stages[3]}, 오(午)=${stages[6]}, 유(酉)=${stages[9]})`;
    }
</script>

</body>
</html>
