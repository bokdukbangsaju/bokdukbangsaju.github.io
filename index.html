<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예비 공인중개사의 명리학 공부</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        /* 3. 제목 스타일 */
        .main-title {
            font-size: 32px;
            font-weight: 800;
            color: #2c3e50;
            text-align: center;
            letter-spacing: -1px;
            border-bottom: 3px solid #e67e22;
            padding-bottom: 12px;
            width: 100%;
            max-width: 500px;
        }

        /* 4. Sub메뉴 3분할 상단 탭 영역 */
        .sub-menu-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .tab-card {
            background: #2c3e50;
            color: #ffffff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .tab-card.coming-soon {
            background: #95a5a6;
            color: #ecf0f1;
        }

        /* 콘텐츠 영역 (3개의 컬럼 레이아웃: 명리학관련 / 부동산관련 / 법관련) */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .category-column {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-column.active-column {
            background: #ffffff;
            border-color: #3498db;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.08);
        }

        .column-title {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #cbd5e1;
        }

        /* 하부 메뉴 링크 버튼 스타일 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-item {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            text-align: center;
            text-decoration: none;
            color: #2c3e50;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .link-item:hover {
            background: #3498db;
            color: #ffffff;
            border-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }

        /* 추가 예정 항목 스타일 */
        .empty-item {
            background: #f1f5f9;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }

        /* 푸터 영역 */
        .footer-section {
            text-align: center;
            font-size: 13px;
            color: #718093;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
            width: 100%;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .sub-menu-tabs, .category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- 3. 제목 -->
        <h1 class="main-title">예비 공인중개사의 명리학 공부</h1>

        <!-- 4. Sub메뉴 탭 구성 ([명리학관련], [부동산관련], [법관련]) -->
        <div class="sub-menu-tabs">
            <div class="tab-card">명리학관련</div>
            <div class="tab-card coming-soon">부동산관련 (추가예정)</div>
            <div class="tab-card coming-soon">법관련 (추가예정)</div>
        </div>

        <!-- 하부 메뉴 및 추가 예정 영역 컨테이너 -->
        <div class="category-grid">
            
            <!-- 1) 명리학관련 하부 메뉴 (새창 실행 링크 반영) -->
            <div class="category-column active-column">
                <div class="column-title">명리학관련 자료</div>
                <div class="link-list">
                    <a href="haru.html" target="_blank" class="link-item">하루한장명리</a>
                    <a href="5haeng.html" target="_blank" class="link-item">5행</a>
                    <a href="cheongan.html" target="_blank" class="link-item">천간</a>
                    <a href="jijivsjiji.html" target="_blank" class="link-item">지지 vs 지지</a>
                    <a href="hyeongchung.html" target="_blank" class="link-item">형충회합파해</a>
                    <a href="mulsang01.html" target="_blank" class="link-item">물상론</a>
                    <a href="japyoron.html" target="_blank" class="link-item">좌표론</a>
                    <a href="oneday.html" target="_blank" class="link-item">하루한장책정리</a>
                    <a href="terms.html" target="_blank" class="link-item">용어정리</a>
                </div>
            </div>

            <!-- 2) 부동산관련 (추가 예정) -->
            <div class="category-column">
                <div class="column-title">부동산관련</div>
                <div class="empty-item">
                    추가 예정입니다.<br>(공인중개사 공부 자료)
                </div>
            </div>

            <!-- 3) 법관련 (추가 예정) -->
            <div class="column-title" style="display:none;"></div> <!-- 레이아웃 균형용 -->
            <div class="category-column">
                <div class="column-title">법관련</div>
                <div class="empty-item">
                    추가 예정입니다.<br>(민법 및 부동산 관련 법령)
                </div>
            </div>

        </div>

        <!-- 푸터 안내 영역 -->
        <div class="footer-section">
            <p>Copyright &copy; 예비 공인중개사의 명리학 공부 All Rights Reserved.</p>
        </div>

    </div>

</body>
</html>
